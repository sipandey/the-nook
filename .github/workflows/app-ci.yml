name: app-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: web

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # OPENAI_API_KEY is the only env var next build actually needs at
      # build time (src/lib/ai/openai.ts constructs an OpenAI client at
      # module scope, so an unset key throws during page-data collection
      # for the /api/ai/* routes) — verified by building with a fully
      # empty environment before writing this workflow. Clerk/Supabase
      # keys are NOT required to build; only at request time. A dummy
      # value is enough — no real key, no network call happens.
      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
