<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .frame { width: 300px; height: 620px; background: #f6f4ee; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #33362f; display: flex; flex-direction: column; position: relative; overflow: hidden; border: 1.5px solid #33362f; }
    .topbar { padding: 16px 16px 10px; flex-shrink: 0; }
    .title { font-size: 17px; font-weight: 700; }
    .segmented { display: flex; border: 1.3px solid #ded8c6; border-radius: 9px; overflow: hidden; margin-top: 12px; }
    .seg { flex: 1; text-align: center; padding: 8px 0; font-size: 12px; font-weight: 600; color: #7a7568; }
    .seg.active { background: #4f6b52; color: #fff; }
    .content { flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .hero-card { border: 1.3px solid #ded8c6; border-radius: 12px; padding: 16px; background: linear-gradient(135deg,#e4ead9,#f6f4ee); position: relative; }
    .hero-label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #7a7568; }
    .hero-title { font-size: 16px; font-weight: 700; margin-top: 6px; line-height: 1.3; }
    .hero-stats { display: flex; gap: 14px; margin-top: 12px; }
    .stat { font-size: 10px; color: #7a7568; }
    .stat b { display: block; font-size: 14px; color: #33362f; font-weight: 700; }
    .watch-btn { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; background: #4f6b52; color: #fff; border-radius: 9px; padding: 10px; font-size: 12px; font-weight: 600; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #7a7568; margin-top: 4px; }
    .small-card { display: flex; align-items: center; gap: 10px; border: 1.2px solid #ded8c6; border-radius: 10px; padding: 10px 12px; background: #fff; }
    .small-card .play { width: 26px; height: 26px; border-radius: 50%; border: 1.2px solid #ded8c6; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .small-card .label { font-size: 12px; font-weight: 600; }
    .small-card .sub { font-size: 10px; color: #7a7568; }
    .tabbar { display: flex; justify-content: space-around; align-items: center; height: 58px; border-top: 1.3px solid #ded8c6; background: #f6f4ee; flex-shrink: 0; }
    .tabitem { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; color: #7a7568; }
    .tabitem.active { color: #4f6b52; }
    .mini-hero { height: 52px; flex-shrink: 0; overflow: hidden; }
  </style>
</helmet>
<div class="frame">
  <div class="mini-hero">
    <svg viewBox="0 0 300 52" width="300" height="52" preserveAspectRatio="none">
      <defs><linearGradient id="mh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1e4"/><stop offset="1" stop-color="#dbe6d3"/></linearGradient></defs>
      <rect width="300" height="52" fill="url(#mh)"/>
      <circle cx="30" cy="12" r="9" fill="#f3e9c9" opacity="0.85"/>
      <path d="M0,28 C50,38 90,22 150,32 C210,42 250,26 300,34 L300,52 L0,52 Z" fill="#a9c19f" opacity="0.85"/>
      <path d="M0,40 C60,46 120,34 180,42 C230,48 270,38 300,42 L300,52 L0,52 Z" fill="#7c9b74"/>
    </svg>
  </div>
  <div class="topbar">
    <div class="title">Playback</div>
    <div class="segmented">
      <div class="seg active">Week</div>
      <div class="seg">Month</div>
      <div class="seg">Year</div>
    </div>
  </div>
  <div class="content">
    <div class="hero-card">
      <div class="hero-label">Aug 17 &ndash; 23</div>
      <div class="hero-title">Your Week in Review</div>
      <div class="hero-stats">
        <div class="stat">Entries<b>5</b></div>
        <div class="stat">Mood<b>Rising</b></div>
        <div class="stat">Top theme<b>Work</b></div>
      </div>
      <div class="watch-btn">
        <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><path d="M8.5 7.2 13 10l-4.5 2.8V7.2z"/></svg>
        Watch recap
      </div>
    </div>

    <div class="section-title">Earlier recaps</div>
    <div class="small-card">
      <div class="play"><svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8.5 7.2 13 10l-4.5 2.8V7.2z"/></svg></div>
      <div>
        <div class="label">July, in review</div>
        <div class="sub">22 entries &middot; steady upward mood</div>
      </div>
    </div>
    <div class="small-card">
      <div class="play"><svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8.5 7.2 13 10l-4.5 2.8V7.2z"/></svg></div>
      <div>
        <div class="label">2025, so far</div>
        <div class="sub">168 entries &middot; 4 manifestations realized</div>
      </div>
    </div>
  </div>
  <div class="tabbar">
    <div class="tabitem">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L10 3l7 6.5"/><path d="M5 8.5V17h10V8.5"/></svg>
      Home
    </div>
    <div class="tabitem">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 3.5h9a2 2 0 0 1 2 2V17H6a2 2 0 0 1-2-2V3.5z"/><path d="M4 3.5a2 2 0 0 0-2 2V15a2 2 0 0 0 2 2"/></svg>
      Journal
    </div>
    <div class="tabitem active">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M8.5 7.2 13 10l-4.5 2.8V7.2z"/></svg>
      Playback
    </div>
    <div class="tabitem">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 17S3 12.5 3 7.8A3.8 3.8 0 0 1 10 5.5 3.8 3.8 0 0 1 17 7.8C17 12.5 10 17 10 17z"/></svg>
      Manifest
    </div>
    <div class="tabitem">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.4 4.6l-1.4 1.4M6 12.6l-1.4 1.4M15.4 15.4l-1.4-1.4M6 7.4 4.6 6"/></svg>
      Settings
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
