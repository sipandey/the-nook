<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .frame { width: 300px; height: 620px; background: #2c3a2c; color: #f6f4ee; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; border: 1.5px solid #2c3a2c; }
    .progress-row { display: flex; gap: 4px; padding: 10px 12px 0; flex-shrink: 0; }
    .seg-track { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.25); overflow: hidden; }
    .seg-fill { height: 100%; background: #fff; }
    .storytop { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; flex-shrink: 0; }
    .tone-label { font-size: 10px; color: rgba(255,255,255,0.65); }
    .content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 22px; gap: 16px; }
    .headline { font-size: 17px; font-weight: 700; text-align: center; line-height: 1.3; }
    .compare-row { display: flex; align-items: stretch; gap: 8px; width: 100%; }
    .compare-card { flex: 1; border: 1.3px solid rgba(255,255,255,0.35); border-radius: 10px; padding: 12px; }
    .compare-label { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: rgba(255,255,255,0.55); }
    .compare-text { font-size: 11px; line-height: 1.4; margin-top: 6px; color: rgba(255,255,255,0.9); }
    .mood-tag { display: inline-block; margin-top: 8px; font-size: 9px; border-radius: 999px; padding: 3px 8px; }
    .mood-tag.then { background: rgba(239,68,68,0.18); color: #fca5a5; }
    .mood-tag.now { background: rgba(52,211,153,0.18); color: #6ee7b7; }
    .arrow { display: flex; align-items: center; color: rgba(255,255,255,0.5); }
    .tapzones { position: absolute; top: 40px; bottom: 60px; left: 0; right: 0; display: flex; }
    .tapzones div { flex: 1; }
    .hill-silhouette { position: absolute; bottom: 0; left: 0; right: 0; height: 46px; pointer-events: none; }
  </style>
</helmet>
<div class="frame">
  <div class="progress-row">
    <div class="seg-track"><div class="seg-fill" style="width:100%"></div></div>
    <div class="seg-track"><div class="seg-fill" style="width:100%"></div></div>
    <div class="seg-track"><div class="seg-fill" style="width:100%"></div></div>
    <div class="seg-track"><div class="seg-fill" style="width:0%"></div></div>
  </div>
  <div class="storytop">
    <div class="tone-label">Weekly Playback &middot; as your Coach</div>
    <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.6"><path d="M4.5 4.5l11 11M15.5 4.5l-11 11"/></svg>
  </div>
  <div class="content">
    <div class="headline">Same topic, different tone</div>
    <div class="compare-row">
      <div class="compare-card">
        <div class="compare-label">Feb 2026</div>
        <div class="compare-text">"I froze up before the presentation again. Everyone must think I don't belong here."</div>
        <div class="mood-tag then">Anxious</div>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10h12M11 5l5 5-5 5"/></svg>
      </div>
      <div class="compare-card">
        <div class="compare-label">Today</div>
        <div class="compare-text">"Presented the roadmap. Nervous for the first minute, then it just felt like a conversation."</div>
        <div class="mood-tag now">Steady</div>
      </div>
    </div>
  </div>
  <div class="tapzones"><div></div><div></div></div>
  <div class="hill-silhouette">
    <svg viewBox="0 0 300 46" width="300" height="46" preserveAspectRatio="none">
      <path d="M0,26 C50,18 90,32 150,24 C210,16 250,28 300,20 L300,46 L0,46 Z" fill="rgba(246,244,238,0.07)"/>
      <path d="M0,36 C60,30 120,42 180,34 C230,28 270,40 300,34 L300,46 L0,46 Z" fill="rgba(246,244,238,0.11)"/>
    </svg>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
